<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            color: #fff;
        }
        .neon {
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff69b4;
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 pt-6 mt-10">
        <h1 class="text-3xl font-bold neon">Neon Visualizer</h1>
        <input type="file" id="file-picker" class="block mb-4" accept=".mp3, .ogg, .wav, .m4a, .flac, .aac" multiple>
        <button id="play-button" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Play</button>
        <button id="stop-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Stop</button>
        <div id="visualizer" class="h-64 w-full border border-gray-500 mt-4"></div>
        <audio id="audio" src="" type="audio/mpeg"></audio>
    </div>

    <script>
        const filePicker = document.getElementById('file-picker');
        const playButton = document.getElementById('play-button');
        const stopButton = document.getElementById('stop-button');
        const audio = document.getElementById('audio');
        const visualizer = document.getElementById('visualizer');

        let currentFile = null;

        filePicker.addEventListener('change', (e) => {
            const files = e.target.files;
            currentFile = files[0];
            audio.src = URL.createObjectURL(currentFile);
        });

        playButton.addEventListener('click', () => {
            if (currentFile) {
                audio.play();
                // Create visualizer
                const ctx = document.createElement('canvas').getContext('2d');
                visualizer.appendChild(ctx.canvas);
                ctx.canvas.width = visualizer.offsetWidth;
                ctx.canvas.height = visualizer.offsetHeight;
                const analyser = audio.context.createAnalyser();
                const source = audio.context.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audio.context.destination);
                function draw() {
                    requestAnimationFrame(draw);
                    const bufferLength = analyser.frequencyBinCount;
                    const data = new Uint8Array(bufferLength);
                    analyser.getByteTimeDomainData(data);
                    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                    ctx.beginPath();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ff69b4';
                    for (let i = 0; i < bufferLength; i++) {
                        const x = i * ctx.canvas.width / bufferLength;
                        const y = ctx.canvas.height / 2 + (data[i] * ctx.canvas.height / 256);
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    ctx.stroke();
                }
                draw();
            }
        });

        stopButton.addEventListener('click', () => {
            audio.pause();
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
